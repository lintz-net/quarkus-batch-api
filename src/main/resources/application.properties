# ===================================================
# Spring Batch Dashboard API - Quarkus Configuration
# ===================================================

# Datasource (ajuste para o seu banco)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:batch_user}
quarkus.datasource.password=${DB_PASS:batch_pass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/batch_db}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# HTTP
quarkus.http.port=8080

# CORS - permite que o frontend Angular acesse a API
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:3000
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Spring Batch Dashboard API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para monitoramento de jobs Spring Batch

# Jackson - serializa LocalDateTime como ISO-8601
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non-null

# Logs
quarkus.log.level=INFO
quarkus.log.category."com.batch".level=DEBUG

# ===================================================
# Perfil de teste
# ===================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.http.cors=true
